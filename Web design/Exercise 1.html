<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Showcase</title>
  <style> 
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f4f6f8;
    }

    h2 {
      margin-bottom: 15px;
    }

    .products {
      display: grid; 
      grid-template-columns: repeat(4, 1fr); 
      gap: 15px; 
      margin-bottom: 30px;
    }

    .card {
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
    }

    .card:hover {
      transform: translateY(-5px); 
      box-shadow: 0 8px 16px rgba(0,0,0,0.2); 
    }

    .price {
      font-weight: bold;
      margin: 8px 0;
    }

    button {
      padding: 10px 15px;
      background-color: darkgrey;
    }
    
  </style>
</head>
<body>

  <h2>Product Showcase &reg;</h2>

  <div class="products">
    <div class="card"> 
      <h3>Smartphone</h3>
      <div class="price">Price: &euro;699 </div>
      <p>Smartphone → fast and reliable</p>
    </div>

    <div class="card">
      <h3>Laptop</h3>
      <div class="price">Price: &euro;999 </div>
      <p>Laptop → perfect for work and study</p>
    </div>

    <div class="card">
      <h3>Headphones</h3>
      <div class="price">Price: &euro;666 </div>
      <p>Headphones → immersive sound</p>
    </div>

    <div class="card">
      <h3>Smart Watch</h3>
      <div class="price">Price: &euro;169 </div>
      <p>Smart watch → track your daily activity</p>
    </div>
  </div>

  <button onclick="togglePrice()">Toggle Price</button> 

  <script>
    function togglePrice() { 
      const prices = document.getElementsByClassName('price'); 

      for (let i = 0; i < prices.length; i++) {
        if (prices[i].style.display === 'none') {
          prices[i].style.display = 'block'; 
        } else {
          prices[i].style.display = 'none'; 
        }
      }
    }
  </script>

  

</body>
</html>
