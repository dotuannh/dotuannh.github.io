<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Sản Phẩm - Sao Béo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .detail-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
        }

        .detail-image {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #d0f0ff, #eff9fa);
            border-radius: 20px;
            min-height: 400px;
        }

        .detail-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 2rem;
        }

        .detail-info h1 {
            font-size: 2rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
        }

        .detail-price {
            font-size: 1.8rem;
            color: var(--primary-color);
            font-weight: bold;
            margin-bottom: 2rem;
        }

        .detail-section {
            margin-bottom: 2rem;
        }

        .detail-section h3 {
            color: var(--primary-color);
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
        }

        .detail-section p {
            line-height: 1.8;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .detail-section ul {
            list-style: none;
            padding-left: 0;
        }

        .detail-section li {
            color: #333;
            margin-bottom: 0.8rem;
            padding-left: 1.5rem;
            position: relative;
        }

        .detail-section li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: var(--primary-color);
            font-weight: bold;
        }

        .detail-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn-add {
            flex: 1;
            padding: 1rem;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-add:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn-back {
            flex: 1;
            padding: 1rem;
            background: transparent;
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-back:hover {
            background: var(--primary-color);
            color: white;
        }

        @media (max-width: 768px) {
            .detail-container {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
        }
    </style>
</head>

            <div class="detail-price" id="productPrice"></div>

            </div>

            </div>

            </div>
        </div>

        // Get product ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const productId = parseInt(urlParams.get('id')) || 1;
        const product = products[productId];

        // Helper to escape HTML
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // Render details
        if (product) {
            document.getElementById('productName').textContent = product.name;
            document.getElementById('productPrice').textContent = product.price.toLocaleString('vi-VN') + '₫';
            document.getElementById('productImage').src = product.image;
            document.getElementById('productImage').alt = product.name;
            document.getElementById('productImage').title = product.name;

            const introEl = document.getElementById('productIntro');
            if (Array.isArray(product.intro)) {
                introEl.innerHTML = product.intro.map(p => `<p>${escapeHtml(p)}</p>`).join('');
            } else {
                const parts = String(product.intro).split(/\n\s*\n/);
                introEl.innerHTML = parts.map(p => `<p>${escapeHtml(p).replace(/\n/g, '<br>')}</p>`).join('');
            }

            document.getElementById('productSpecs').innerHTML = (product.specs || []).map(s => `<li>${escapeHtml(s)}</li>`).join('');
            document.getElementById('productNotes').innerHTML = (product.notes || []).map(n => `<li>${escapeHtml(n)}</li>`).join('');

            // Wire add to cart
            const addBtn = document.getElementById('addCartBtn');
            addBtn.onclick = () => { addToCart(productId, product.name, product.price, product.image); };
        } else {
            document.getElementById('productName').textContent = 'Sản phẩm không tồn tại';
