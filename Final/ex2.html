<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Computer Parts Price List</title>
  <link rel="stylesheet" href="ex2.css">

</head>
<body>

  <h2>Computer Parts Price List &copy; TechStore&trade;</h2>

  <p> &bull; Available items</p>
  <p> &bull; Updated 2025</p>

  <table id="priceTable"> 
    <tr> 
      <th>Computer Part</th> 
      <th>Price (USD)</th>
    </tr>
    <tr>
      <td>CPU</td> 
      <td>$250</td> 
    </tr>
    <tr>
      <td>RAM</td>
    </tr>
    <td>$120</td> 
    <tr>
      <td>SSD</td>
      <td>$180</td>
    </tr>
    <tr>
      <td>Graphics Card</td> 
      <td>$450</td>
    </tr>
  </table>

  <button onclick="changeColor()">Change Color</button>

  <script>
    function changeColor() {
      // get table by ID and change text color to red
      document.getElementById("priceTable").style.color = "red";
    }
  </script>

</body>
</html>
